---
layout: default
---
<div class="post-list">
  {% for post in site.posts %}
  <article class="post-card">
    <a href="{{ post.url | relative_url }}" class="post-card-link">
      <time>{{ post.date | date: "%b %-d, %Y" }}</time>
      <h2>{{ post.title }}</h2>
      {% if post.summary %}<p>{{ post.summary }}</p>{% endif %}
      <span class="read-more">read more →</span>
    </a>
  </article>
  {% endfor %}
</div>
