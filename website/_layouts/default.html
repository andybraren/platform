<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <header class="site-header">
    <div class="landing-container">
      <div class="header-inner">
        <a href="{{ '/' | relative_url }}" class="logo">
          <span class="logo-text">ambient-code</span><span class="logo-dot">.ai</span>
        </a>
        <nav>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/docs/' | relative_url }}">Docs</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/ambient-code" class="nav-gh">GitHub</a>
          <button class="search-trigger" aria-label="Search" title="Search (⌘K)">
            <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.5"/><line x1="11.5" y1="11.5" x2="16" y2="16"/></svg>
            <kbd class="search-kbd">⌘K</kbd>
          </button>
        </nav>
      </div>
      <p class="tagline">// breakthrough software engineering concepts</p>
    </div>
  </header>

  <main class="landing-container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="landing-container">
      <div class="footer-inner">
        <span class="footer-sig">ambient-code.ai</span>
        <a href="https://github.com/ambient-code">github.com/ambient-code</a>
      </div>
    </div>
  </footer>

  {% include search-overlay.html %}
</body>
</html>
