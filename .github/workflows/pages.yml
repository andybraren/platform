name: Deploy Website + Docs to Pages

on:
  push:
    branches:
      - main
      - onboard-revamp
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Copy docs into Jekyll collection ──
      - name: Prepare docs collection
        run: |
          cp -r docs website/_docs
          rm -rf website/_docs/archive
          find website/_docs -name '*.mmd' -delete

          # Prepend YAML front matter so Jekyll renders .md files as HTML
          for f in $(find website/_docs -name '*.md'); do
            if ! head -1 "$f" | grep -q '^---$'; then
              printf -- '---\n---\n\n' | cat - "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done

          # Set permalink on docs index so it serves at /docs/
          sed -i '2i permalink: /docs/' website/_docs/index.md

          # Rewrite .md links to directory-style URLs for Jekyll routing
          find website/_docs -name '*.md' -exec sed -i -E \
            's|\]\(([^)]*[^/])\.md([#)])|\]\(\1/\2|g; s|\]\(([^)]*[^/])\.md\)|\]\(\1/\)|g' {} +

      # ── Jekyll (full site: landing + blog + docs) ──
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: website

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}"
        working-directory: website

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
