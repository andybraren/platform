<div id="search-overlay" class="search-overlay" role="dialog" aria-label="Search">
  <div class="search-container">
    <div class="search-input-wrap">
      <svg class="search-input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="7.5" cy="7.5" r="5.5"/>
        <line x1="11.5" y1="11.5" x2="16" y2="16"/>
      </svg>
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search blog posts and documentation..."
        autocomplete="off"
        spellcheck="false"
      />
      <kbd class="search-esc">esc</kbd>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>
