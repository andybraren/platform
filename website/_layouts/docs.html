<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      mermaid.initialize({
        startOnLoad: true,
        theme: 'dark',
        themeVariables: {
          primaryColor: '#1a1a26',
          primaryTextColor: '#c9c9d6',
          primaryBorderColor: '#2a2a3e',
          lineColor: '#00e89d',
          secondaryColor: '#12121a',
          tertiaryColor: '#0b0b0f',
          fontFamily: 'Inter, sans-serif'
        }
      });
    });
  </script>
</head>
<body>

  <header class="site-header">
    <div class="landing-container">
      <div class="header-inner">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="ACP – Ambient Code Platform">
          <span class="logo-mark"><span class="logo-a">A</span>CP</span>
        </a>
        <nav>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/docs/' | relative_url }}" class="nav-active">Docs</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/ambient-code" class="nav-gh">GitHub</a>
          <button class="search-trigger" aria-label="Search" title="Search (⌘K)">
            <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.5"/><line x1="11.5" y1="11.5" x2="16" y2="16"/></svg>
            <kbd class="search-kbd">⌘K</kbd>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <div class="docs-layout landing-container">
    <button class="docs-sidebar-toggle" aria-label="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>

    <aside class="docs-sidebar" id="docs-sidebar">
      <div class="docs-sidebar-header">
        <span class="docs-sidebar-title">Documentation</span>
      </div>
      <nav class="docs-nav">
        <ul class="nav-root">
          {% include docs_nav_items.html items=site.data.docs_nav %}
        </ul>
      </nav>
    </aside>

    <main class="docs-content">
      <article class="docs-article">
        <div class="post-content">
          {{ content }}
        </div>
      </article>
    </main>
  </div>

  <footer class="site-footer">
    <div class="landing-container">
      <div class="footer-inner">
        <span class="footer-sig"><span class="logo-a">A</span>CP</span>
        <a href="https://github.com/ambient-code">github.com/ambient-code</a>
      </div>
    </div>
  </footer>

  {% include search-overlay.html %}

  <script>
    document.querySelectorAll('.nav-section-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var section = btn.parentElement;
        var children = section.querySelector('.nav-children');
        var isOpen = section.classList.contains('nav-section-open');
        section.classList.toggle('nav-section-open', !isOpen);
        children.classList.toggle('nav-children-open', !isOpen);
        btn.setAttribute('aria-expanded', !isOpen);
      });
    });

    var toggle = document.querySelector('.docs-sidebar-toggle');
    var sidebar = document.getElementById('docs-sidebar');
    if (toggle && sidebar) {
      toggle.addEventListener('click', function() {
        sidebar.classList.toggle('docs-sidebar-open');
      });
    }
  </script>

</body>
</html>
