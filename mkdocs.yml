site_name: Ambient Code Platform Documentation
site_description: AI-powered automation platform for intelligent agentic workflows
site_author: Ambient Code Community
site_url: https://acp-docs.example.com

repo_name: ambient-code/platform
repo_url: https://github.com/ambient-code/platform
edit_uri: edit/main/docs/

exclude_docs: |
  README.md
  archive/**

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
    - Local Development: guides/local-development.md
    - Deployment: guides/deployment.md
    - Integrations:
      - GitHub App: integrations/GITHUB_APP_SETUP.md
      - GitLab: integrations/gitlab-integration.md
      - Google Workspace: integrations/google-workspace.md
    - Observability: observability/README.md
  - Architecture:
    - Overview: architecture/README.md
    - Diagrams:
      - Index: architecture/diagrams/index.md
      - System Overview: architecture/diagrams/system-overview.md
      - Session Lifecycle: architecture/diagrams/session-lifecycle.md
    - Decisions:
      - Kubernetes-Native Architecture: architecture/decisions/0001-kubernetes-native-architecture.md
      - User Token Authentication: architecture/decisions/0002-user-token-authentication.md
      - Multi-Repo Support: architecture/decisions/0003-multi-repo-support.md
      - Go Backend, Python Runner: architecture/decisions/0004-go-backend-python-runner.md
      - NextJS, Shadcn, React Query: architecture/decisions/0005-nextjs-shadcn-react-query.md
  - Testing:
    - Overview: testing/README.md
    - E2E Testing Guide: testing/e2e-guide.md
  - Tools:
    - Amber Automation: tools/amber.md
  - Reference:
    - Overview: reference/index.md
    - Glossary: reference/glossary.md
    - Model Pricing: reference/model-pricing.md
  - Deployment:
    - OpenShift Deployment: deployment/OPENSHIFT_DEPLOY.md
    - OpenShift OAuth: deployment/OPENSHIFT_OAUTH.md
    - Git Authentication: deployment/git-authentication.md
    - Langfuse Observability: deployment/langfuse.md
    - S3 Storage: deployment/s3-storage-configuration.md
    - MinIO: deployment/minio-quickstart.md

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - toc:
      permalink: true
